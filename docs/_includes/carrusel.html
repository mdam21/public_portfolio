<style>
  .logos-slider-container {

  }

  .logos-slider-track {

    width: max-content;
    gap: 80px;

  }

  }

    flex-shrink: 0 !important; /* Evita que las imágenes colapsen o se aplasten */

    height: 60px;       
    width: auto;        
    display: block;

    background: transparent !important;
  }

    transform: scale(1.3);
  }

  @keyframes scroll-infinite {
  0% { 
    transform: translateX(0); 
  }

    transform: translateX(-50%); /* Removido el cálculo estático para asegurar transición limpia */
